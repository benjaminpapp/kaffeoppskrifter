navn: Emi Fukahori Switch
niva: lett
modus: hybrid
brygger: "Hario Switch (hybrid: lukket → åpen)"
beskrivelse: Starter med immersion i lukket Switch og går over til perkolering. Intens og smaksrik kopp.
kaffe: 14
vann: 200
temp: 93 °C
malegrad: 5.0
tid: ca. 2:20
karakter:
  syre: 3
  sodme: 4
  fylde: 3
  klarhet: 4
steg:
  - tid: "0:00"
    tekst: Switch **lukket**, hell opp til **50 g** og la det trekke
  - tid: "0:30"
    tekst: "**Åpne** Switch og begynn å helle"
  - tid: "1:10"
    ca: true
    tekst: Hell ferdig opp til **200 g**
  - tid: "2:20"
    ca: true
    tekst: Ferdig når alt vannet har rent gjennom
notater: >-
  Hell fra moderat høyde, og bruk vann på 80–100 ppm. La koppen kjøle seg 2–5 min.
  Glass-Switch gir mer syre, mens sort keramikk gir mer fylde.
kilde:
  navn: Emi Fukahori (European Coffee Trip)
  url: https://europeancoffeetrip.com/easy-hario-switch-recipe-emi-fukahor/
