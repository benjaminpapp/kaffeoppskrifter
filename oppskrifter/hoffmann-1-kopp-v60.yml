    tekst: Hell opp til **100 g**
  - tid: "1:10"
    tekst: Hell opp til **150 g**
  - tid: "1:30"
    tekst: Hell opp til **200 g**
  - tid: "1:50"
    tekst: Hell opp til **250 g**, og virvle forsiktig ved 2:00
  - tid: "3:00"
    ca: true
    tekst: Ferdig når alt vannet har rent gjennom
notater: Forvarm Switchen godt, for en liten dose mister fort varme. Smak er viktigere enn nøyaktig drawdown-tid.
