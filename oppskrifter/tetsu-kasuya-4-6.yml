navn: Tetsu Kasuya 4:6
niva: avansert
modus: åpen
brygger: Hario Switch (åpen, som V60)
beskrivelse: Vinneroppskriften fra World Brewers Cup 2016. De to første hellingene (40 %) styrer syre mot sødme, de tre siste (60 %) styrer styrken.
kaffe: 20
vann: 300
temp: 92 °C
malegrad: 6.5
tid: "3:30"
karakter:
  syre: 3
  sodme: 3
