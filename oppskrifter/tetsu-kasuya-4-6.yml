  klarhet: 4
steg:
  - tid: "0:00"
    tekst: Hell opp til **60 g**
  - tid: "0:45"
    tekst: Hell opp til **120 g**
  - tid: "1:30"
    tekst: Hell opp til **180 g**
  - tid: "2:15"
    tekst: Hell opp til **240 g**
  - tid: "3:00"
    tekst: Hell opp til **300 g**
  - tid: "3:30"
    tekst: Ta av Switchen, og koppen er ferdig
notater: >-
  Hver helling bør ta rundt 10 sek. Søtere kopp: gjør første helling mindre enn andre (f.eks. 50 + 70 g).
  Mer syre: gjør første helling størst. Sterkere kopp: del de siste 180 g i flere hellinger.
