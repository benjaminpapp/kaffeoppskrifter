# Utstyret som oppskriftene er tilpasset. Vises øverst på nettsiden.
- utstyr: Brygger
  modell: Hario Switch 02
  tips: Skyll filteret med varmt vann og tøm det før du heller i kaffen. Rist sengen flat før første helling.
- utstyr: Filter
  modell: Cafec Abaca Cup 4 (2–4 kopper, AC4-100W)
  tips: Gir en ren kopp med god klarhet, men renner litt tregere enn vanlige Hario-filtre. Tar bryggen lengre tid enn oppskriften sier, mal 0,2–0,3 grovere.
- utstyr: Kvern
  modell: 1Zpresso ZP6 Special
  tips: Ett tall er 10 klikk. Juster i steg på 0,2–0,3. Finere hvis koppen er sur eller tynn, grovere hvis den er bitter eller tørr.
- utstyr: Vannkoker
  modell: Flair svanehals med temperaturstyring
  tips: Still inn temperaturen fra oppskriften. Til Devil's Recipe senker du til 70 °C med litt kaldt vann.
- utstyr: Vekt
  modell: Timemore med tidtaker og ratio
  tips: Sett ratioen fra oppskriften, tarer med kaffen i, og start tidtakeren samtidig med første helling. Alle vekter er totalvekt.
